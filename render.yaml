# CP5 — Cấu hình deploy Render (dùng nếu bạn chọn Render).
#
# Render đọc file này khi bạn tạo Blueprint từ repo GitHub.
# `sync: false` = Render hỏi giá trị lúc deploy, KHÔNG lưu secret vào repo.

services:
  - type: web
    name: day12-agent-trandinhduy
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    branch: main
    # GitHub Actions triggers the Render deploy hook only after its test and
    # image-build jobs pass. This avoids deploying an unverified commit.
    autoDeployTrigger: off
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: AGENT_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"
      - key: REDIS_URL
        fromService:
          name: day12-redis
          type: redis
          property: connectionString

  - type: redis
    name: day12-redis
    plan: free
    ipAllowList: []
