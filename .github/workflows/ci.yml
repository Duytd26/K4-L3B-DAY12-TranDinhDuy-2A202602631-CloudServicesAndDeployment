name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # CP5 calls the already-deployed public service, so it belongs to the
        # post-deploy smoke test rather than this pull-request CI job. Docker
        # build tests are covered by the next job.
        run: pytest tests/test_cp1.py tests/test_cp2.py tests/test_cp3.py tests/test_cp4.py tests/test_bonus_cicd.py --ignore=tests/test_cp5.py -m "not docker" -q

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t agent:ci .

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs:
      - test
      - build
    # The first Render Blueprint deployment is created manually. Afterwards,
    # add RENDER_DEPLOY_HOOK_URL to GitHub Actions secrets to enable the hook.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip until deploy hook is configured
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "Render deploy hook is not configured yet; skipping deployment."

      - name: Trigger Render deploy hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_HOOK_URL"
